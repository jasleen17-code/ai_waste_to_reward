<style>
:root{--bg:#031230;--card:#08204a;--line:#1d4a94;--pink:#ec407a;--txt:#fff;--mut:#9fb3d6;--ok:#3ddc97}

.logo{font-weight:800;font-size:22px;letter-spacing:1px}.logo b{color:var(--pink)}

.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding-top:70px}
.tags{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.tags i{font-style:normal;border:1px solid var(--pink);color:var(--pink);padding:5px 16px;border-radius:99px;font-weight:600}
.btn{background:var(--pink);color:#fff;border:0;padding:12px 24px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-family:inherit}
.btn.o{background:transparent;border:1px solid var(--line)}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.stat b{font-size:34px;color:var(--pink);display:block}.stat span{color:var(--mut);font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:30px}
.step{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 20px;position:relative}
.step em{font-style:normal;color:var(--pink);font-weight:700}.step h3{margin:6px 0}.step p{color:var(--mut);margin:0;font-size:15px}
.step:not(:last-child)::after{content:"\2192";position:absolute;right:-18px;top:42%;color:var(--pink);font-size:24px;font-weight:900;z-index:2}
.ngos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.ngo{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.ngo.near{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.ngo h4{margin:6px 0 2px;font-size:18px}.ngo small{color:var(--mut);display:block}
.badge{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;background:#12306a;color:var(--mut)}
.badge.live{background:#0e3b2c;color:var(--ok)}.badge.pk{background:var(--pink);color:#fff}
.scan{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;margin-top:28px;align-items:start}
.drop{border:2px dashed var(--line);border-radius:16px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;cursor:pointer;overflow:hidden}
.drop.on{border-color:var(--pink)}.drop img,.drop video,.drop canvas{max-width:100%;max-height:340px;border-radius:12px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.bar{height:10px;background:#12306a;border-radius:9px;overflow:hidden;margin:4px 0 10px}.bar div{height:100%;background:var(--pink);width:0;transition:width .6s}
.res h3{font-size:28px;margin:4px 0}.res small{color:var(--mut)}
.blk{border-top:1px solid #12306a;margin-top:16px;padding-top:14px}.blk h5{margin:0 0 8px;font-size:16px;color:var(--pink)}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:700;font-size:13px;vertical-align:middle}
.rec{background:#0e3b2c;color:var(--ok)}.nrec{background:#4a1b2b;color:#ff8aa8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}.kv span{color:var(--mut)}
.res ul{margin:0;padding-left:20px}.res li{margin:3px 0}
.opts{display:grid;gap:10px}.opt{text-align:left;background:#0a2a5e;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;font-family:inherit;font-size:15px}
.opt:hover:not(:disabled){border-color:var(--pink)}.opt b{display:block;font-size:16px}.opt span{color:var(--mut);font-size:13px}.opt:disabled{opacity:.55;cursor:default}.opt.sel{border-color:var(--ok);opacity:1}
.done{background:#0e3b2c;color:var(--ok);padding:10px 14px;border-radius:10px;margin-top:12px;font-size:14px}
.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px}
.hist{margin-top:22px;max-height:260px;overflow:auto}.hist div{display:flex;justify-content:space-between;gap:12px;padding:9px 4px;border-bottom:1px solid #12306a;font-size:14px}.hist small{color:var(--mut)}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.cls .card{padding:16px}.cls b{display:block}.cls span{color:var(--mut);font-size:13px}
footer{text-align:center;color:var(--mut);padding:40px;border-top:1px solid var(--line)}
.spin{width:34px;height:34px;border:4px solid #12306a;border-top-color:var(--pink);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(max-width:860px){.hero,.scan{grid-template-columns:1fr}.steps,.dash{grid-template-columns:1fr 1fr}.cls,.ngos{grid-template-columns:1fr}.step::after{display:none}.links{display:none}}

.hid{display:none!important}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}

.lcard h2{font-size:26px}.lcard input,.addr{width:100%;background:#0a2a5e;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px 12px;font-size:15px;margin:6px 0;font-family:inherit}
.addr.err{border-color:#ff5c7a}.err-t{color:#ff8aa8;font-size:13px;min-height:18px}
#sms{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);z-index:60;background:#fff;color:#111;border-radius:12px;padding:12px 18px;max-width:92vw;box-shadow:0 8px 30px #0008;transition:.4s;cursor:pointer;font-size:14px}#sms.show{transform:translate(-50%,0)}
.trk{margin-top:16px}.trk .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.trk small{color:var(--mut)}
.tl{margin:16px 0 6px}.stp{display:flex;gap:12px;position:relative;padding-bottom:14px}
.stp i{width:14px;height:14px;border-radius:50%;background:#12306a;border:2px solid var(--line);margin-top:4px;flex:none;z-index:1}
.stp:not(:last-child)::before{content:"";position:absolute;left:6px;top:18px;bottom:0;width:2px;background:#12306a}
.stp.dn i{background:var(--ok);border-color:var(--ok)}.stp.dn:not(:last-child)::before{background:var(--ok)}.stp.cu i{box-shadow:0 0 0 4px #3ddc9744}
.stp b{display:block;font-size:15px}.stp:not(.dn) b{color:var(--mut);font-weight:500}
.status{background:#0a2a5e;border-left:3px solid var(--pink);padding:10px 12px;border-radius:8px;font-size:14px;margin:8px 0}
.col,.otpb{background:#0a2a5e;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14px}
.otpn{font-size:28px;letter-spacing:6px;font-weight:800;color:var(--pink)}
.mini{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}.mini input{max-width:160px;margin:0}
.btn.s{padding:8px 14px;font-size:14px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;font-weight:800;font-size:18px;border:2px solid #ffffff44;cursor:pointer;margin-right:10px;font-family:inherit}
.avatar.big{width:58px;height:58px;font-size:26px;margin:0;flex:none;display:flex;align-items:center;justify-content:center;cursor:default}
.pp{position:fixed;top:64px;right:4vw;width:350px;max-width:92vw;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;z-index:20;box-shadow:0 12px 40px #000a;max-height:85vh;overflow:auto}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.pgrid div{background:#0a2a5e;border-radius:12px;padding:10px 12px}.pgrid b{font-size:22px;color:var(--pink);display:block}.pgrid span{font-size:12px;color:var(--mut)}
.lb{margin-top:22px;padding:6px 0}.lbr{display:grid;grid-template-columns:50px 1fr 70px 90px 90px;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid #12306a}
.lbr.hd{color:var(--mut);font-size:13px}.lbr.me{background:#0e2a5a;border-left:3px solid var(--pink)}.lbr .nm{display:flex;gap:10px;align-items:center}

.lbr .pt{font-weight:800;color:var(--pink);text-align:right}.lbr .rk{font-size:20px;text-align:center}

.mk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.mk span{background:#0a2a5e;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}.an{display:grid;gap:8px}.an div{opacity:.35;transition:.3s}.an div.on{opacity:1;color:var(--ok)}@media(max-width:560px){.mk{grid-template-columns:1fr}}

function setMode(k){modeKey=k;$("mode").textContent=t(k);$("mode").style.cursor=k==="m_fail"?"pointer":"default"}
const withTO=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout after "+ms/1000+"s")),ms))]);
async function init(){
 if(typeof tf==="undefined"){setMode("m_nolib");return}
 mode="none";setMode("m_load");$("mode").className="badge";
 try{
  const lr=await withTO(fetch("model/labels.json",{cache:"no-store"}),8000);
  if(!lr.ok)throw new Error("labels.json not found");
  labels=await lr.json();
  model=await withTO(tf.loadLayersModel("model/model.json"),40000);
  mode="custom";setMode("m_custom");$("mode").className="badge live";
 }catch(e){
  console.warn("Custom model not loaded:",e);
  try{
   if(typeof mobilenet==="undefined")throw new Error("mobilenet lib missing");
   const urls=[null,"https://storage.googleapis.com/tfjs-models/savedmodel/mobilenet_v2_1.0_224/model.json"];
   let last=null;mob=null;
   for(const u of urls){
    try{mob=await withTO(mobilenet.load(u?{version:2,alpha:1.0,modelUrl:u}:{version:2,alpha:1.0}),20000);break}
    catch(x){last=x;console.warn("mobilenet source failed:",u||"default",x)}
   }
   if(!mob)throw last||new Error("mobilenet failed");
   mode="demo";setMode("m_demo");
  }catch(e2){console.error(e2);mode="none";setMode("m_fail")}
 }
 if(curEl&&mode!=="none")$("go").disabled=false;
}
$("mode").onclick=()=>{if(mode==="none"&&modeKey==="m_fail")init()};
const KW={
 "Plastic":["water bottle","pop bottle","plastic bag","bottle","jug","container","bucket","lotion","sunscreen","soap dispenser","pill bottle","shaker","toy"],
 "Glass":["beer bottle","wine bottle","goblet","vase","beer glass","wine","red wine","perfume","jar","lens"],
 "Metal":["can opener","tin","pot","wok","frying pan","cleaver","hammer","screw","nail","padlock","chain","spatula","ladle","strainer","safety pin","knife"],
 "Cardboard":["carton","crate","packet","box","envelope","pizza"],
 "Paper":["paper towel","notebook","book jacket","menu","comic book","newspaper","toilet tissue","binder","tissue","crossword"],
 "Textile Trash":["jersey","sock","jean","sweatshirt","t-shirt","cardigan","scarf","diaper","wool","dishrag","shirt","apron","pajama","fur coat","bath towel","handkerchief"],
 "Food Organics":["banana","orange","lemon","apple","strawberry","pineapple","broccoli","cauliflower","cucumber","mushroom","bagel","pretzel","burrito","hotdog","cheeseburger","guacamole","carbonara","fig","pomegranate","corn","zucchini","squash","artichoke","bell pepper","head cabbage","custard","meat loaf","potato"],
 "Religious Waste":["totem pole","altar","prayer rug","candle","pedestal","vestment","bell cote","church","monastery","mosque","stupa","incense","rosary","marigold","garland"],
 "Vegetation":["daisy","leaf","pot","hay","greenhouse","lawn","acorn","buckeye","hip","coral fungus","rapeseed","yellow lady","vine","valley","thatch"]
};
function mapDemo(preds){
 const sc={};preds.forEach(p=>{const n=p.className.toLowerCase();for(const k in KW)if(KW[k].some(w=>n.includes(w)))sc[k]=(sc[k]||0)+p.probability});
 let arr=Object.entries(sc).sort((a,b)=>b[1]-a[1]);if(!arr.length)arr=[["Miscellaneous Trash",0.4]];
 const tot=arr.reduce((a,x)=>a+x[1],0);
 return arr.slice(0,3).map(([l,v])=>({label:l,p:Math.min(0.95,v/Math.max(tot,0.01)*Math.min(1,tot*1.6+0.35))}));
}
async function predict(el){
 if(mode==="custom"){
  const out=tf.tidy(()=>model.predict(tf.browser.fromPixels(el).resizeBilinear([224,224]).toFloat().div(127.5).sub(1).expandDims()));
  const d=await out.data();out.dispose();
  return Array.from(d).map((p,i)=>({label:labels[i],p})).sort((a,b)=>b.p-a.p).slice(0,3);
 }
 if(mode==="demo")return mapDemo(await mob.classify(el,10));
 throw new Error("Model is still loading or failed to load");
}

/* ================= UI ================= */
function show(el){curEl=el;$("drop").innerHTML="";$("drop").appendChild(el);$("go").disabled=false}
function loadFile(f){if(!f)return;stopCam();const im=new Image();im.onload=()=>show(im);im.src=URL.createObjectURL(f)}
$("up").onclick=()=>$("file").click();$("drop").onclick=()=>{if(!curEl&&!stream)$("file").click()};
$("file").onchange=e=>loadFile(e.target.files[0]);
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("on")};
$("drop").ondragleave=()=>$("drop").classList.remove("on");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("on");loadFile(e.dataTransfer.files[0])};
function stopCam(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}$("cam").textContent=t("b_cam")}
$("cam").onclick=async()=>{
 if(stream){const v=$("drop").querySelector("video"),c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);stopCam();show(c);return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=document.createElement("video");v.srcObject=stream;v.autoplay=true;v.playsInline=true;
  $("drop").innerHTML="";$("drop").appendChild(v);$("cam").textContent=t("b_cap");curEl=null;$("go").disabled=true}
 catch(e){alert("Camera not available / कैमरा उपलब्ध नहीं है")}
};
$("go").onclick=async()=>{
 if(!curEl)return;
 $("res").innerHTML=`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px"><div class="spin"></div><b>${t("r_busy")}</b></div><div class="an">${[1,2,3,4].map(i=>`<div id="an${i}">✓ ${t("an"+i)}</div>`).join("")}</div>`;
 const T0=Date.now();let k=1;$("an1").classList.add("on");
 const iv=setInterval(()=>{k++;const e=$("an"+k);if(e)e.classList.add("on")},450);
 try{
  const top=await predict(curEl);
  const wait=2000-(Date.now()-T0);if(wait>0)await new Promise(r=>setTimeout(r,wait));clearInterval(iv);
  const key=l=>{const n=String(l).replace(/^\d+[-_ ]*/,"").replace(/_/g," ").trim().toLowerCase();return KEYS.find(k=>k.toLowerCase()===n)||"Miscellaneous Trash"};
  cur={cls:key(top[0].label),conf:Math.round(top[0].p*100),others:top.slice(1).map(x=>({k:key(x.label),p:Math.round(x.p*100)})),done:null,addr:S.addr||"",err:false};
  renderResult();
 }catch(e){clearInterval(iv);cur=null;console.error(e);
  $("res").innerHTML=`<div class="sub">${t("r_err")}${e.message||e}</div><div class="blk"><small style="color:var(--mut)">${t("man_hint")}</small><div class="mk" style="margin-top:8px">${KEYS.map(k=>`<button class="chip mpick" data-k="${k}">${C[k][lang].n}</button>`).join("")}</div><div class="row"><button class="btn o s" id="retryM">${t("man_retry")}</button></div></div>`;
  document.querySelectorAll(".mpick").forEach(b=>b.onclick=()=>{cur={cls:b.dataset.k,conf:100,others:[],done:null,addr:S.addr||"",err:false,manual:true};renderResult()});
  $("retryM").onclick=()=>{$("res").innerHTML=`<div class="sub">${t("m_load")}</div>`;init().then(()=>{if(mode!=="none")$("go").click()})};
 }
};
gate();applyLang();init();
</script>
</body>
